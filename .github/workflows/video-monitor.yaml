name: video-monitor

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/zwift_video_monitor/**'
      - '.github/workflows/video-monitor.yaml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller psutil

    - name: Self test (parser)
      run: |
        python tools/zwift_video_monitor/selftest.py

    - name: Build executable
      run: |
        pyinstaller --onefile --console --uac-admin --name zwift_video_monitor tools/zwift_video_monitor/zwift_video_monitor.py

    - name: Smoke test executable
      run: |
        dist\zwift_video_monitor.exe --help

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: zwift_video_monitor-windows
        path: dist/zwift_video_monitor.exe
